<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lorienart</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Static form stubs for Netlify's build-time crawler.
         These are never shown to users — they exist only so Netlify
         registers the forms before the JS bundle runs. -->
    <form name="kontakt" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="kontakt" />
      <input name="name" /><input name="email" /><textarea
        name="message"
      ></textarea>
    </form>
  </body>
</html>
