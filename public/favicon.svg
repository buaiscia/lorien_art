<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- dark rounded background -->
  <rect width="32" height="32" rx="7" fill="#292524"/>
  <!-- soundboard body (filled trapezoid) -->
  <path d="M8 26 L8 9 Q10 3.5 22 8.5 Q24.5 11 23.5 15 L21 26 Z" fill="#c4955a"/>
  <!-- vertical pillar -->
  <rect x="6.5" y="8.5" width="3" height="17.5" rx="1.5" fill="#f0dbb4"/>
  <!-- base foot -->
  <rect x="6.5" y="24" width="15" height="2.8" rx="1.4" fill="#f0dbb4"/>
  <!-- curved neck -->
  <path d="M8 9.5 Q11 3 22 8.5" stroke="#f0dbb4" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- strings -->
  <line x1="12"  y1="10.5" x2="11.5" y2="24" stroke="#f0dbb4" stroke-width="0.85" stroke-linecap="round" opacity="0.75"/>
  <line x1="14.5" y1="9.5"  x2="14.5" y2="24" stroke="#f0dbb4" stroke-width="0.85" stroke-linecap="round" opacity="0.75"/>
  <line x1="17"  y1="9.2"  x2="17"   y2="24" stroke="#f0dbb4" stroke-width="0.85" stroke-linecap="round" opacity="0.75"/>
  <line x1="19.5" y1="9.8"  x2="19.5" y2="24" stroke="#f0dbb4" stroke-width="0.85" stroke-linecap="round" opacity="0.75"/>
</svg>
